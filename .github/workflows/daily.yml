name: daily brief

on:
  schedule:
    # Hourly through the US session, then once after the close.
    #
    # 13:30-21:30 UTC is 09:30-17:30 ET in summer and 08:30-16:30 in winter,
    # so this brackets the cash session in both DST regimes and the last run
    # clears the CFTC Commitments of Traders release (Friday ~15:30 ET).
    #
    # Only the Yahoo-sourced rows -- equities, crude, gold, FX -- actually
    # move between these runs. Everything from FRED publishes daily at best,
    # and the metrics are daily and weekly by nature, so the analysis half of
    # the page is unchanged within a day. Nine runs on weekdays is about 200
    # deployments a month, which stays well inside Cloudflare Pages' free
    # allowance; running around the clock would roughly triple that to rebuild
    # a page nobody is reading at 04:00.
    - cron: "30 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -W error
      - run: python -m brief.cli build
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cross-asset-brief
