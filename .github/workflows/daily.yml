name: daily brief

on:
  schedule:
    # 21:30 UTC weekdays. CFTC releases the Commitments of Traders on Friday
    # at ~15:30 ET, which is 19:30 UTC in summer and 20:30 UTC in winter, so
    # a 12:30 UTC run always preceded the week's release and the new
    # positioning only ever reached the page on Monday. 21:30 UTC clears the
    # release in both DST regimes and is still hours after the FRED morning
    # update, which is what the earlier slot was chosen for.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -W error
      - run: python -m brief.cli build
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cross-asset-brief
